<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Works — Braq</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/works.css" />
</head>
<body class="works-page">

  <!-- ================= BLURRED BACKDROP ================= -->
  <div class="backdrop" aria-hidden="true">
    <div class="backdrop-wordmark">
      <span>B</span><span>r</span><span>a</span><span>q</span>
    </div>
  </div>

  <!-- ================= BACK LINK ================= -->
  <a href="index.html" class="back-link">← Braq</a>

  <!-- ================= MAIN ================= -->
  <main class="works">

    <!-- Side-scrolling image strip -->
    <div class="works-strip" id="worksStrip">

      <figure class="work" data-index="0">
        <img src="Assets/works/Bella.jpg" alt="Bella" loading="lazy" />
      </figure>

      <figure class="work" data-index="1">
        <img src="Assets/works/DSCF17861.jpg" alt="Work" loading="lazy" />
      </figure>

      <figure class="work" data-index="2">
        <img src="Assets/works/DSCF2722-Enhanced1.jpg" alt="Work" loading="lazy" />
      </figure>

      <figure class="work" data-index="3">
        <img src="Assets/works/DSCF29481.jpg" alt="Work" loading="lazy" />
      </figure>

      <figure class="work" data-index="4">
        <img src="Assets/works/DSCF32041.jpg" alt="Work" loading="lazy" />
      </figure>

      <figure class="work" data-index="5">
        <img src="Assets/works/DSCF37951.jpg" alt="Work" loading="lazy" />
      </figure>

      <figure class="work" data-index="6">
        <img src="Assets/works/DSCF74401.jpg" alt="Work" loading="lazy" />
      </figure>

      <figure class="work" data-index="7">
        <img src="Assets/works/DSCF79181.jpg" alt="Work" loading="lazy" />
      </figure>

    </div>

    <!-- Index toggle — the word itself -->
    <button class="index-toggle" id="indexToggle" aria-label="Toggle index view">
      Index
    </button>

  </main>

  <script src="js/works.js"></script>

</body>
</html>
